# Release: push a tag like v2.0.0 and this packages the suite and publishes a GitHub release.
#
# The release carries Forever-<version>.zip (the ForeverCore, ForeverTweaks and ForeverCompendium
# folders, each as it is in the repository) and release.json, the file addon managers such as
# WowUp read to find the zip and the game flavour it's for. Its notes are that version's entry in
# ForeverCore/Changelog.lua. The tag must match every TOC's ## Version, so a release can't ship a
# version the game would show differently.
#
# The same zip also goes to CurseForge (so the CurseForge app, and WowUp's CurseForge source, can
# install and update it) when ForeverCore's TOC has ## X-Curse-Project-ID and the repository has a
# CF_API_KEY secret (an API token from https://legacy.curseforge.com/account/api-tokens). The
# CF_GAME_VERSION repository variable picks the CurseForge game version to file it under (its
# name, e.g. 12.0.0); without it, the newest Retail version. Without the ID or the key, the
# CurseForge step is skipped and only the GitHub release is made.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 zip

      - name: Tests
        run: lua5.1 tests/run.lua

      - name: Version matches the tag
        id: version
        run: |
          version=$(grep -m1 '^## Version:' ForeverCore/ForeverCore.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          interface=$(grep -m1 '^## Interface:' ForeverCore/ForeverCore.toc | sed 's/^## Interface:[[:space:]]*//' | tr -d '\r')
          for toc in */*.toc; do
            other=$(grep -m1 '^## Version:' "$toc" | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
            if [ "v$other" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME doesn't match $toc's version $other."; exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "interface=$interface" >> "$GITHUB_OUTPUT"

      - name: Release notes from Changelog.lua
        run: |
          lua5.1 - "${{ steps.version.outputs.version }}" > notes.md <<'LUA'
          local version = arg[1]
          local ns = {}
          assert(loadfile("ForeverCore/Changelog.lua"))("ForeverCore", ns)
          for _, release in ipairs(ns.changelog) do
            if release.version == version then
              for _, change in ipairs(release.changes) do
                local where = change.module and (" (" .. change.module .. ")") or ""
                print("- **" .. change.kind .. "**" .. where .. ": " .. change.text)
              end
              return
            end
          end
          error("ForeverCore/Changelog.lua has no entry for " .. version)
          LUA

      - name: Package
        run: |
          version=${{ steps.version.outputs.version }}
          mkdir -p build
          for addon in ForeverCore ForeverTweaks ForeverCompendium; do cp -r "$addon" build/; done
          (cd build && zip -qr "Forever-$version.zip" ForeverCore ForeverTweaks ForeverCompendium)
          cat > build/release.json <<JSON
          {
            "releases": [
              {
                "name": "Forever",
                "version": "$version",
                "filename": "Forever-$version.zip",
                "nolib": false,
                "metadata": [ { "flavor": "mainline", "interface": ${{ steps.version.outputs.interface }} } ]
              }
            ]
          }
          JSON

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.version.outputs.version }}
          gh release create "$GITHUB_REF_NAME" "build/Forever-$version.zip" build/release.json \
            --title "Forever $version" --notes-file notes.md

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
        run: |
          project=$(grep -m1 '^## X-Curse-Project-ID:' ForeverCore/ForeverCore.toc | sed 's/^## X-Curse-Project-ID:[[:space:]]*//' | tr -d '\r')
          if [ -z "$project" ] || [ -z "$CF_API_KEY" ]; then
            echo "No X-Curse-Project-ID in the TOC or no CF_API_KEY secret: skipping CurseForge."; exit 0
          fi
          version=${{ steps.version.outputs.version }}
          api=https://wow.curseforge.com/api
          versions=$(curl -sfS -H "X-Api-Token: $CF_API_KEY" "$api/game/versions")
          if [ -n "$CF_GAME_VERSION" ]; then
            game=$(echo "$versions" | jq --arg name "$CF_GAME_VERSION" '[.[] | select(.name == $name) | .id] | first')
          else
            # 517 is CurseForge's Retail game version type; the newest has the highest id.
            game=$(echo "$versions" | jq '[.[] | select(.gameVersionTypeID == 517)] | max_by(.id) | .id')
          fi
          if [ -z "$game" ] || [ "$game" = "null" ]; then
            echo "CurseForge has no game version '${CF_GAME_VERSION:-Retail}'."; exit 1
          fi
          case "$version" in
            *alpha*) type=alpha ;;
            *beta*) type=beta ;;
            *) type=release ;;
          esac
          metadata=$(jq -n --rawfile notes notes.md --arg name "Forever $version" \
            --arg type "$type" --argjson game "$game" \
            '{changelog: $notes, changelogType: "markdown", displayName: $name, releaseType: $type, gameVersions: [$game]}')
          curl -sfS -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=$metadata" -F "file=@build/Forever-$version.zip" \
            "$api/projects/$project/upload-file"
